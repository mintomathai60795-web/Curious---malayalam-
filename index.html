
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practical Joke</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 50px 20px;
}
button {
  padding: 16px 25px;
  border: 0;
  border-radius: 10px;
  background: #3182ce;
  color: white;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>😂 Practical Joke</h1>
<p>This demonstration can share your current location with your consent.</p>
<button onclick="getLocation()">Share my location</button>
<p id="status"></p>

<script>
function getLocation() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "Location is not supported.";
    return;
  }

  status.textContent = "Waiting for location permission...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      status.textContent =
        "Permission granted! Latitude: " + lat +
        " Longitude: " + lon;
    },
    function() {
      status.textContent = "Location permission was not granted.";
    }
  );
}
</script>
</body>
</html>
